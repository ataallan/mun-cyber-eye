{% extends "base.html" %}
{% block title %}Sign in · {{ product_name }}{% endblock %}
{% block content %}
<section class="card login-card">
  <h1>Operator sign-in</h1>
  <p class="muted">Minimal session auth for authorized reviewers. Demo credentials are in <code>.env.example</code>.</p>
  <form method="post" class="form">
    <label>Username
      <input type="text" name="username" autocomplete="username" required>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
  <p class="fineprint">AI detects and alerts. Humans verify and decide.</p>
</section>
{% endblock %}
