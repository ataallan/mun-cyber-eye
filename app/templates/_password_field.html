{% macro password_field(field_id, name, label, autocomplete, minlength=None, readonly_until_focus=False, show_label="Show password", hide_label="Hide password") %}
<div class="field">
  <label for="{{ field_id }}">{{ label }}</label>
  <div class="password-field">
    <input id="{{ field_id }}" class="password-input" type="password" name="{{ name }}" autocomplete="{{ autocomplete }}" required{% if minlength %} minlength="{{ minlength }}"{% endif %}{% if readonly_until_focus %} readonly onfocus="this.removeAttribute('readonly')"{% endif %}>
    <button type="button" class="password-toggle" data-password-toggle data-label-show="{{ show_label }}" data-label-hide="{{ hide_label }}" aria-controls="{{ field_id }}" aria-label="{{ show_label }}" aria-pressed="false">
      <svg class="password-toggle-icon password-toggle-icon-show" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
        <circle fill="none" stroke="currentColor" stroke-width="2" cx="12" cy="12" r="3"/>
      </svg>
      <svg class="password-toggle-icon password-toggle-icon-hide" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a18.45 18.45 0 0 1 5.06-5.94"/>
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/>
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M1 1l22 22"/>
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
      </svg>
    </button>
  </div>
</div>
{% endmacro %}

{% macro password_toggle_script() %}
<script src="{{ url_for('static', filename='js/password-toggle.js') }}" defer></script>
{% endmacro %}
